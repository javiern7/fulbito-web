<div class="max-w-3xl mx-auto p-4">
  <mat-card class="rounded-2xl shadow-xl bg-white p-6">

    <h2 class="text-2xl font-extrabold mb-4 text-center">
      Crear Equipo
    </h2>

    <form [formGroup]="form" (ngSubmit)="save()" class="grid gap-4">

      <!-- Nombre -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nombre del Equipo</mat-label>
        <input matInput formControlName="name" placeholder="Ej: Unión Solidaria FC" />
        <mat-error *ngIf="form.get('name')?.hasError('required')">Nombre requerido</mat-error>
        <mat-error *ngIf="form.get('name')?.hasError('minlength')">Mínimo 3 caracteres</mat-error>
      </mat-form-field>

      <!-- Short Name -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nombre Corto</mat-label>
        <input matInput formControlName="shortName" placeholder="Ej: USF" />
        <mat-error *ngIf="form.get('shortName')?.hasError('required')">Nombre corto requerido</mat-error>
      </mat-form-field>

      <!-- Colores -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="p-3 rounded-xl border">
          <div class="font-semibold mb-2">Color Primario</div>
          <input type="color" formControlName="colorPrimary" class="w-full h-12 rounded" />
        </div>

        <div class="p-3 rounded-xl border">
          <div class="font-semibold mb-2">Color Secundario</div>
          <input type="color" formControlName="colorSecondary" class="w-full h-12 rounded" />
        </div>
      </div>

      <!-- Escudos base -->
      <div class="mt-2">
        <div class="font-bold mb-2">Escudo (elige uno base)</div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <button
            type="button"
            *ngFor="let logo of defaultLogos"
            (click)="pickLogo(logo)"
            class="border rounded-xl p-3 hover:shadow-lg transition"
            [class.ring-4]="selectedLogo === logo"
            [class.ring-blue-500]="selectedLogo === logo">

            <img [src]="logo" class="h-20 mx-auto" />
          </button>
        </div>

        <div class="mt-4 text-center">
          <div class="font-semibold mb-2">Vista previa</div>
          <img [src]="selectedLogo" class="h-28 mx-auto" />
        </div>
      </div>

      <!-- Acciones -->
      <div class="flex justify-end gap-2 mt-4">
        <button mat-stroked-button type="button" (click)="cancel()">
          Cancelar
        </button>
        <button mat-flat-button color="primary" type="submit">
          Guardar
        </button>
      </div>

    </form>
  </mat-card>
</div>
